name: Browser Stable

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install current Google Chrome Stable
        shell: python
        run: |
          import os, pathlib, subprocess, urllib.request
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "google-chrome-stable"
          root.mkdir()
          archive = root / "google-chrome-stable_current_amd64.deb"
          urllib.request.urlretrieve("https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb", archive)
          subprocess.run(["sudo", "apt-get", "install", "--yes", str(archive)], check=True)
          chrome = "/usr/bin/google-chrome-stable"
          version = subprocess.check_output([chrome, "--version"], text=True).strip()
          print(f"Chrome channel: stable; actual version: {version}", flush=True)
          evidence = pathlib.Path("test-results")
          evidence.mkdir(exist_ok=True)
          (evidence / "chrome-version.txt").write_text(version + "\n")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"CHROME_PATH={chrome}\n")
      - name: Install and run the full headless suite
        shell: python
        run: |
          import subprocess
          subprocess.run(["npm", "ci"], check=True)
          subprocess.run(["npm", "run", "check"], check=True)
          subprocess.run(["npm", "test"], check=True)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-chrome-stable
          path: test-results/
          retention-days: 7
          if-no-files-found: warn

  macos:
    needs: headless
    runs-on: macos-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        mode: [headless, headed]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install current Google Chrome Stable
        shell: python
        run: |
          import os, pathlib, subprocess, urllib.request
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "google-chrome-stable"
          root.mkdir()
          archive = root / "googlechrome.dmg"
          urllib.request.urlretrieve("https://dl.google.com/chrome/mac/universal/stable/GGRO/googlechrome.dmg", archive)
          volume = root / "volume"
          volume.mkdir()
          subprocess.run(["hdiutil", "attach", "-nobrowse", "-readonly", "-mountpoint", str(volume), str(archive)], check=True)
          app = root / "Google Chrome.app"
          try:
              subprocess.run(["ditto", str(volume / "Google Chrome.app"), str(app)], check=True)
          finally:
              subprocess.run(["hdiutil", "detach", str(volume)], check=True)
          chrome = app / "Contents" / "MacOS" / "Google Chrome"
          version = subprocess.check_output([str(chrome), "--version"], text=True).strip()
          print(f"Chrome channel: stable; actual version: {version}", flush=True)
          evidence = pathlib.Path("test-results")
          evidence.mkdir(exist_ok=True)
          (evidence / "chrome-version.txt").write_text(version + "\n")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"CHROME_PATH={chrome}\n")
      - name: Install and run the full suite
        shell: python
        env:
          STEWARD_HEADED: ${{ matrix.mode == 'headed' && '1' || '' }}
        run: |
          import subprocess
          subprocess.run(["npm", "ci"], check=True)
          subprocess.run(["npm", "run", "check"], check=True)
          subprocess.run(["npm", "test"], check=True)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-chrome-stable-${{ matrix.mode }}
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
